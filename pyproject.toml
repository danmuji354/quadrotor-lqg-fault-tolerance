[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrotor-lqg-fault-tolerance"
version = "0.1.0"
description = "Planar quadrotor LQG control with sensor faults and deterministic benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "danmuji354"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

